<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 160" preserveAspectRatio="none" width="100%" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Degradado perla: blanco -> beige clarito -> blanco perlado -->
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="35%"  stop-color="#FBF7EF"/>
      <stop offset="70%"  stop-color="#F3EBDD"/>
      <stop offset="100%" stop-color="#FFFDF8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F6EEDF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Ola principal -->
  <path d="M0,0 H1440 V100 C1200,160 1000,40 720,90 C440,140 240,40 0,100 Z" fill="url(#pearl)"/>
  <!-- Ola de brillo -->
  <path d="M0,0 H1440 V70 C1180,120 980,20 720,62 C450,105 230,20 0,70 Z" fill="url(#shine)"/>
</svg>
